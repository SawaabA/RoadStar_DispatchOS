services:
  integrations:
    environment:
      ROUTING_PROVIDER: RoadStar OSRM Ontario
      ROUTING_BASE_URL: http://osrm:5000
      REQUIRE_ROUTING: "true"
    depends_on:
      osrm:
        condition: service_healthy

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    command: ["osrm-routed", "--algorithm", "mld", "/data/ontario-latest.osrm"]
    volumes:
      - ./deploy/osrm/data:/data:ro
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
