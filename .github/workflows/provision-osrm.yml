name: Provision Ontario OSRM

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROVISION-ONTARIO to download and preprocess the Ontario graph
        required: true

concurrency:
  group: provision-production-osrm
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PROVISION-ONTARIO"
      - name: Configure pinned SSH host identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST, and DEPLOY_USER are required for OSRM provisioning."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a readable OpenSSH private key."
            exit 1
          fi
      - name: Resolve current RoadStar image
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          REGISTRY: ghcr.io
      - name: Copy and run guarded provisioner
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ vars.DEPLOY_PATH || '/opt/roadstar' }}
          TAG: ${{ github.sha }}
        run: |
          scp -o StrictHostKeyChecking=yes deploy/provision-osrm.sh docker-compose.osrm.yml "$SSH_USER@$SSH_HOST:$TARGET/"
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "chmod 700 '$TARGET/provision-osrm.sh' && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$TAG' '$TARGET/provision-osrm.sh' '$TARGET'"
