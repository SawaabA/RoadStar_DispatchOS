name: RoadStar quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start production stack
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          APP_ORIGIN: http://localhost:8080
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify production readiness and direct SPA route
        run: |
          curl --fail --show-error http://127.0.0.1:8080/readyz
          curl --fail --show-error http://127.0.0.1:8080/driver
          curl --fail --show-error http://127.0.0.1:8080/api/integrations/health
      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose down --volumes
